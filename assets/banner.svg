<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradient Cyan-Blue -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glowing Line Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <style>
      .pulse-circle {
        transform-origin: 1040px 140px;
        animation: radarPulse 3.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .pulse-circle-2 {
        transform-origin: 1040px 140px;
        animation: radarPulse 3.5s cubic-bezier(0.2, 0.8, 0.2, 1) 1.2s infinite;
      }
      .telemetry-flow {
        stroke-dasharray: 12 8;
        animation: flowDash 20s linear infinite;
      }
      .signal-ping {
        animation: pingDot 2s ease-in-out infinite alternate;
      }
      .badge-glow {
        animation: floatBadge 4s ease-in-out infinite alternate;
      }
      @keyframes radarPulse {
        0% { r: 10px; opacity: 0.9; }
        50% { opacity: 0.4; }
        100% { r: 120px; opacity: 0; }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -400; }
      }
      @keyframes pingDot {
        0% { fill: #38bdf8; filter: drop-shadow(0 0 2px #38bdf8); }
        100% { fill: #10b981; filter: drop-shadow(0 0 10px #10b981); }
      }
      @keyframes floatBadge {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="20" fill="url(#bgGrad)" />

  <!-- Cyber Grid Pattern in Background -->
  <g opacity="0.12" stroke="#60a5fa" stroke-width="0.8">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
  </g>

  <!-- Ambient Glow Blurs (Backdrop) -->
  <circle cx="1040" cy="140" r="160" fill="#38bdf8" opacity="0.08" filter="url(#dropGlow)" />
  <circle cx="200" cy="300" r="180" fill="#6366f1" opacity="0.07" filter="url(#dropGlow)" />

  <!-- Animated Telemetry Vector Trails (Background Route) -->
  <g fill="none" opacity="0.45">
    <path class="telemetry-flow" d="M 600,340 C 750,340 820,260 920,240 S 1080,180 1140,110" stroke="#0ea5e9" stroke-width="2.5" />
    <path class="telemetry-flow" d="M 520,380 C 680,380 780,310 880,290 S 1020,220 1120,160" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6 6" />
  </g>

  <!-- Animated Radar Pulse Rings (Behind Graphic Elements, Off-center Right) -->
  <g>
    <circle cx="1040" cy="140" r="10" stroke="#38bdf8" stroke-width="1.8" fill="none" class="pulse-circle" />
    <circle cx="1040" cy="140" r="10" stroke="#818cf8" stroke-width="1.5" fill="none" class="pulse-circle-2" />
    <circle cx="1040" cy="140" r="4" class="signal-ping" />
  </g>

  <!-- Floating Telematics Metric Cards (Right Side Decor) -->
  <g class="badge-glow" transform="translate(860, 50)">
    <!-- Card 1: GPS Status -->
    <g transform="translate(80, 20)">
      <rect width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2"/>
      <circle cx="20" cy="21" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="34" y="26" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600">GPS: <tspan fill="#38bdf8">LOCKED (10 Hz)</tspan></text>
    </g>

    <!-- Card 2: CAN Bus / OBD-II -->
    <g transform="translate(20, 80)">
      <rect width="210" height="42" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1.2"/>
      <circle cx="20" cy="21" r="5" fill="#6366f1"/>
      <text x="34" y="26" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600">CAN-BUS: <tspan fill="#c084fc">J1939 / OBD-II</tspan></text>
    </g>

    <!-- Card 3: Fleet Metric -->
    <g transform="translate(70, 140)">
      <rect width="190" height="42" rx="10" fill="url(#cardGrad)" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.2"/>
      <circle cx="20" cy="21" r="5" fill="#38bdf8"/>
      <text x="34" y="26" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600">FLEET TELEMETRY: <tspan fill="#34d399">ACTIVE</tspan></text>
    </g>
  </g>

  <!-- Left Pill Badge -->
  <g transform="translate(60, 50)">
    <rect width="260" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="18" y="21" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">⚡ ENTERPRISE &amp; OPEN-SOURCE</text>
  </g>

  <!-- FOREGROUND BRANDING / HEADINGS (Guaranteed readable and unobstructed) -->
  <g transform="translate(60, 140)" filter="url(#textShadow)">
    <!-- Main Headline with Gradient -->
    <text x="0" y="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.8">
      Vehicle Telematics
    </text>
    <text x="430" y="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="800" fill="url(#accentGrad)" letter-spacing="-0.8">
      &amp; Fleet Tracking
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="2" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      Curated Ecosystem of Commercial SaaS Platforms, OBD-II/CAN Stacks &amp; Open-Source Servers
    </text>

    <!-- Capability Tags in Foreground -->
    <g transform="translate(2, 85)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="12" y="18" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11.5" font-weight="600">🛰️ GPS Tracking</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(142, 0)">
        <rect width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="12" y="18" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11.5" font-weight="600">📋 ELD Compliance</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(289, 0)">
        <rect width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="12" y="18" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11.5" font-weight="600">🔌 OBD-II &amp; J1939</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(436, 0)">
        <rect width="125" height="28" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="12" y="18" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11.5" font-weight="600">⚡ EV Telemetry</text>
      </g>
      <!-- Tag 5 -->
      <g transform="translate(573, 0)">
        <rect width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="12" y="18" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11.5" font-weight="600">🛡️ Driver Safety</text>
      </g>
    </g>

    <!-- Bottom Highlights -->
    <text x="2" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="500" fill="#64748b">
      Compare SaaS Tiers &amp; Pricing • Stargazer-Ranked Open-Source Tools • Self-Hosted Fleet Gateways
    </text>
  </g>

  <!-- Border Frame Accent -->
  <rect x="0.5" y="0.5" width="1199" height="399" rx="20" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1"/>
</svg>
